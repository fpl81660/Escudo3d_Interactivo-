<title>Escudo 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    body { margin: 0; font-family: Arial, sans-serif; }
    model-viewer { display: block; width: 100%; height: 100vh; }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }
    .controls label { margin-right: 8px; }
    .controls select { padding: 8px; font: inherit; }
    .status { margin: 8px 0 0; font-size: 14px; }
    .status:empty { display: none; }
  </style>
</head>
<body>
  <model-viewer
    alt="Escudo desgastado"
    id="escudo"
    alt="Modelo 3D de un escudo"
    src="./variantes/escudoVariantes_desde_Blender.glb"
    camera-orbit="90deg 90deg auto"
    camera-controls
    touch-action="pan-y">
    
    <div class="controls glass">
      <label for="variant">Variante:</label>
      <select id="variant" disabled>
        <option>Cargando variantes…</option>
      </select>
      <p id="status" class="status" role="status">Cargando escudo…</p>
    </div>
  </model-viewer>
  <script>
    const modelViewerVariants = document.querySelector('#escudo');
    const select = document.querySelector('#variant');
    const status = document.querySelector('#status');

    modelViewerVariants.addEventListener('load', () => {
      const names = modelViewerVariants.availableVariants;
      select.replaceChildren();

      for (const name of names) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      }

      if (names.length === 0) {
        status.textContent = 'Este modelo no contiene variantes.';
        select.disabled = true;
        return;
      }

      const initialVariant = names.includes('Normal') ? 'Normal' : names[0];
      select.value = initialVariant;
      modelViewerVariants.variantName = initialVariant;
      modelViewerVariants.alt = `Escudo: ${initialVariant}`;
      select.disabled = false;
      status.textContent = '';
    });

    select.addEventListener('change', () => {
      modelViewerVariants.variantName = select.value;
      modelViewerVariants.alt = `Escudo: ${select.value}`;
    });

    modelViewerVariants.addEventListener('error', () => {
      select.disabled = true;
      status.textContent = 'No se pudo cargar el escudo. Revisa la ruta del GLB y abre la página con Live Server.';
    });
  </script>
</body>
</html>
